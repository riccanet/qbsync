[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qbsync"
version = "0.3.7"
description = "Read-only sync of QuickBooks Desktop data, pushed to webhooks (n8n) and Postgres."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pg8000>=1.30",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qbsync = "qbsync.cli:main"

[tool.setuptools]
packages = ["qbsync"]

[tool.setuptools.package-data]
qbsync = ["config.template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
